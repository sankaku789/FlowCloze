[package]
name = "flowcloze"
version = "2.2.2-beta"
edition = "2021"
description = "Markdown qblock parser for context cloze question generation."
readme = "README.md"
repository = "https://github.com/sankaku789/FlowCloze"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.27"
ratatui = "0.27"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
httpdate = "1.0"
getrandom = "0.2"
