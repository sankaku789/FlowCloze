name: Release prep

on:
  push:
    branches:
      - release/v2.2.2-beta

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile
        run: cargo check
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: sync 2.2.2-beta lockfile"
          git push
