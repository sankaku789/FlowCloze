name: Target-aware Segments Verification

on:
  push:
    branches:
      - refactor/relax-retry-validation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/relax-retry-validation
      - run: python3 .github/scripts/target-aware-segments.py
      - run: cargo check --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests prompt.segments.txt.example
          if ! git diff --cached --quiet; then
            git commit -m 'Make segment compose target-aware'
            git push origin HEAD:refactor/relax-retry-validation
          fi
