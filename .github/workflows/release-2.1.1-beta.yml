name: Release v2.1.1-beta

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-2.1.1-beta.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Apply release changes
        run: |
          python3 scripts/prepare-2.1.1-beta.py
          cargo check
          cargo fmt --all

      - name: Verify installer injection
        run: |
          bash -n install.sh
          tmp="$(mktemp -d)"
          XDG_CONFIG_HOME="$tmp" CARGO=true ./install.sh
          test -f "$tmp/flowcloze/templates/cloze.typ"
          cmp templates/cloze.typ "$tmp/flowcloze/templates/cloze.typ"
          grep -F 'typst_template = ' "$tmp/flowcloze/config.toml"
          rm -rf "$tmp"

      - name: Verify Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo clippy --all-targets --features gemini-native -- -D warnings
          cargo test --features gemini-native
          grep -A2 'name = "flowcloze"' Cargo.lock | grep -F 'version = "2.1.1-beta"'

      - name: Commit and tag
        run: |
          rm .github/workflows/release-2.1.1-beta.yml
          rm scripts/prepare-2.1.1-beta.py
          rmdir scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: v2.1.1-beta'
          release_sha="$(git rev-parse HEAD)"
          git tag v2.1.1-beta "$release_sha"
          git push origin HEAD:main
          git push origin refs/tags/v2.1.1-beta
