name: Source Artifact

on:
  push:
    branches:
      - feat/stability-aware-batching

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: flowcloze-source
          path: .
          include-hidden-files: true
          retention-days: 1
