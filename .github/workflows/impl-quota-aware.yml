name: Implement quota-aware planner

on:
  push:
    branches:
      - feature/quota-aware-planner

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quota-aware-planner
          fetch-depth: 0

      - name: Apply implementation
        run: python3 .github/scripts/impl_quota_aware.py

      - name: Format
        run: cargo fmt

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test gemini-native
        run: cargo test --locked --features gemini-native

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src config.toml.example
          git commit -m "feat: add quota-aware provider planning"
          git push origin HEAD:feature/quota-aware-planner
