name: Implement quota-aware planner

on:
  push:
    branches:
      - feature/quota-aware-planner

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quota-aware-planner
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 .github/scripts/impl_quota_aware.py
          sed -i 's/remaining\.min(1_000)\.max(1)/remaining.clamp(1, 1_000)/' src/planner.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/orchestration.rs')
          text = p.read_text()
          old = '''    assert_eq!(tokens.len(), 4);\n    assert_eq!(tokens[0], tokens[3]);\n    assert_eq!(tokens[1], tokens[2]);'''
          new = '''    // First content retry is re-batched; only the final retry is single-task.\n    assert_eq!(tokens.len(), 6);\n    assert_eq!(tokens[0], tokens[2]);\n    assert_eq!(tokens[0], tokens[4]);\n    assert_eq!(tokens[1], tokens[3]);\n    assert_eq!(tokens[1], tokens[5]);'''
          if old not in text:
              raise SystemExit('retry regression patch target missing')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test gemini-native
        run: cargo test --locked --features gemini-native

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests config.toml.example
          git commit -m "feat: add quota-aware provider planning"
          git push origin HEAD:feature/quota-aware-planner
