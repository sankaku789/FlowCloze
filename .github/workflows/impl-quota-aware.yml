on:
  push:
    branches:
      - feature/quota-aware-planner

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quota-aware-planner
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch target in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

