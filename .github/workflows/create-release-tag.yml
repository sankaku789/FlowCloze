name: Create v2 release tag

on:
  push:
    paths:
      - .github/workflows/create-release-tag.yml

permissions:
  contents: write

jobs:
  tag:
    name: Tag v2.0.0-beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          RELEASE_SHA: 60696485bf44a7df3938485591690a3f5bd0a60c
          RELEASE_TAG: v2.0.0-beta
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$RELEASE_SHA" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${existing}, expected ${RELEASE_SHA}" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi

      - name: Remove temporary release branches
        run: |
          git push origin :refs/heads/v2.0.0-beta || true
          git push origin :refs/heads/release/v2.0.0-beta || true
