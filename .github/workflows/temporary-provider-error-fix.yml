name: Temporary provider error display fix

on:
  push:
    branches:
      - fix/provider-error-display

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/provider-error-display

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Apply provider error display changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count} for {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/planner.rs",
              "    Api,\n}",
              "    Api { status: u16 },\n}",
          )
          replace_once(
              "src/planner.rs",
              '            Self::Partial { .. } => write!(f, "compose error: partial validation"),',
              '            Self::Partial { .. } => write!(f, "compose error: generation incomplete"),',
          )
          replace_once(
              "src/planner.rs",
              "        ComposeError::Api { .. } => TerminalCause::Api,",
              "        ComposeError::Api { status, .. } => TerminalCause::Api { status: *status },",
          )
          replace_once(
              "src/planner.rs",
              "    pub(crate) fn terminal_cause(&self) -> Option<TerminalCause> {\n        self.terminal_cause\n    }\n",
              "    pub(crate) fn terminal_cause(&self) -> Option<TerminalCause> {\n        self.terminal_cause\n    }\n\n    pub(crate) fn provider_status(&self) -> Option<u16> {\n        match self.terminal_cause {\n            Some(TerminalCause::RateLimited) => Some(429),\n            Some(TerminalCause::Api { status }) => Some(status),\n            _ => None,\n        }\n    }\n",
          )

          replace_once(
              "src/orchestration.rs",
              "        crate::planner::TerminalCause::Api => FailureClass::Api,",
              "        crate::planner::TerminalCause::Api { .. } => FailureClass::Api,",
          )
          replace_once(
              "src/orchestration.rs",
              "            Err(error) => {\n                progress.emit(ProgressEvent::Failed {\n                    stage: crate::progress::ProgressStage::Generate,\n                    class: failure_class_for_execution(&error),\n                });\n                return Err(GenerateMarkdownError::Compose(error.into_public()));\n            }",
              "            Err(error) => {\n                let class = failure_class_for_execution(&error);\n                if error.terminal_cause().is_some() {\n                    progress.emit(ProgressEvent::ProviderError {\n                        class,\n                        status: error.provider_status(),\n                    });\n                }\n                progress.emit(ProgressEvent::Failed {\n                    stage: crate::progress::ProgressStage::Generate,\n                    class,\n                });\n                return Err(GenerateMarkdownError::Compose(error.into_public()));\n            }",
          )

          replace_once(
              "src/progress.rs",
              "    Stdout,\n    Failed {",
              "    Stdout,\n    ProviderError {\n        class: FailureClass,\n        status: Option<u16>,\n    },\n    Failed {",
          )
          replace_once(
              "src/progress.rs",
              "            ProgressEvent::Stdout => \"[4/4] stdout出力完了\".to_string(),\n            ProgressEvent::Failed { stage, class } => {",
              "            ProgressEvent::Stdout => \"[4/4] stdout出力完了\".to_string(),\n            ProgressEvent::ProviderError { class, status } => {\n                format_provider_error(class, status)\n            }\n            ProgressEvent::Failed { stage, class } => {",
          )
          replace_once(
              "src/progress.rs",
              "fn escape(value: &str) -> String {\n    value.escape_debug().to_string()\n}\n",
              "fn format_provider_error(class: FailureClass, status: Option<u16>) -> String {\n    if let Some(status) = status {\n        if let Some(reason) = http_status_reason(status) {\n            return format!(\n                \"Provider error: HTTP {status} {reason} (class={})\",\n                class.as_str()\n            );\n        }\n        return format!(\"Provider error: HTTP {status} (class={})\", class.as_str());\n    }\n\n    let detail = match class {\n        FailureClass::Configuration => \"provider configuration error\",\n        FailureClass::Authentication => \"authentication failed\",\n        FailureClass::RateLimited => \"rate limited\",\n        FailureClass::Timeout => \"request timed out\",\n        FailureClass::Transport => \"connection failed\",\n        FailureClass::Api => \"API request failed\",\n        FailureClass::Content => \"invalid or empty response\",\n        _ => \"request failed\",\n    };\n    format!(\"Provider error: {detail} (class={})\", class.as_str())\n}\n\nfn http_status_reason(status: u16) -> Option<&'static str> {\n    match status {\n        400 => Some(\"Bad Request\"),\n        401 => Some(\"Unauthorized\"),\n        403 => Some(\"Forbidden\"),\n        404 => Some(\"Not Found\"),\n        408 => Some(\"Request Timeout\"),\n        429 => Some(\"Too Many Requests\"),\n        500 => Some(\"Internal Server Error\"),\n        502 => Some(\"Bad Gateway\"),\n        503 => Some(\"Service Unavailable\"),\n        504 => Some(\"Gateway Timeout\"),\n        _ => None,\n    }\n}\n\nfn escape(value: &str) -> String {\n    value.escape_debug().to_string()\n}\n",
          )
          replace_once(
              "src/progress.rs",
              "    #[test]\n    fn noop_never_writes_or_panics() {",
              "    #[test]\n    fn provider_error_renders_http_status_and_reason() {\n        let writer = SharedWriter::default();\n        let sink = PlainProgressSink::with_writer(writer.clone(), \"Gemini\");\n        sink.emit(ProgressEvent::ProviderError {\n            class: FailureClass::RateLimited,\n            status: Some(429),\n        });\n\n        assert_eq!(\n            String::from_utf8(writer.0.lock().unwrap().clone()).unwrap(),\n            \"Provider error: HTTP 429 Too Many Requests (class=rate_limited)\\n\"\n        );\n    }\n\n    #[test]\n    fn provider_error_without_status_is_still_human_readable() {\n        let writer = SharedWriter::default();\n        let sink = PlainProgressSink::with_writer(writer.clone(), \"Gemini\");\n        sink.emit(ProgressEvent::ProviderError {\n            class: FailureClass::Timeout,\n            status: None,\n        });\n\n        assert_eq!(\n            String::from_utf8(writer.0.lock().unwrap().clone()).unwrap(),\n            \"Provider error: request timed out (class=timeout)\\n\"\n        );\n    }\n\n    #[test]\n    fn noop_never_writes_or_panics() {",
          )
          PY

          rm .github/workflows/temporary-provider-error-fix.yml
          cargo fmt --all

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check optional Gemini native adapter
        run: |
          cargo clippy --all-targets --features gemini-native -- -D warnings
          cargo test --features gemini-native

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface provider errors in CLI output"
          git push origin HEAD:fix/provider-error-display
