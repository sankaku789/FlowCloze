name: Prepare v2.1.0-beta

on:
  push:
    paths:
      - .github/workflows/prepare-v2.1.0-beta.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply release changes
        run: |
          python3 .github/scripts/prepare_v2_1.py
          cargo check
          cargo fmt --all

      - name: Verify release
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo clippy --all-targets --features gemini-native -- -D warnings
          cargo test --features gemini-native

      - name: Commit release and tag
        env:
          RELEASE_TAG: v2.1.0-beta
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v2.1.0-beta.yml
          rm .github/scripts/prepare_v2_1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v2.1.0-beta"
          release_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main

          existing="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$release_sha" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${existing}, expected ${release_sha}" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$release_sha"
            git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
