name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - future/model
      - tmp/openai-standardization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    name: Refactor validation
    if: github.ref == 'refs/heads/tmp/openai-standardization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/openai-standardization
          fetch-depth: 0

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Apply refactor
        run: python .github/scripts/standardize_openai.py

      - name: Format
        run: cargo fmt --all

      - name: Clippy default
        run: cargo clippy --all-targets -- -D warnings

      - name: Test default
        run: cargo test

      - name: Validate Gemini native feature
        run: |
          cargo clippy --all-targets --features gemini-native -- -D warnings
          cargo test --features gemini-native

      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml src tests .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'OpenAI互換adapterを標準経路に統合 [skip ci]'
          git push origin HEAD:tmp/openai-standardization

  rust:
    name: Rust
    if: github.ref != 'refs/heads/tmp/openai-standardization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  docs:
    name: OpenAPI docs
    if: github.ref != 'refs/heads/tmp/openai-standardization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npm run docs:api:lint

      - name: Build API docs
        run: npm run docs:api

      - name: Check generated docs are up to date
        run: git diff --exit-code -- docs/api.html
