name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - future/model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Apply provider refactor proposal
        run: python .github/scripts/apply_provider_refactor.py

      - name: Format proposed changes
        run: cargo fmt --all

      - name: Capture provider refactor patch
        run: git diff -- src/config.rs src/main.rs > provider-refactor.patch

      - name: Upload provider refactor patch
        uses: actions/upload-artifact@v4
        with:
          name: provider-refactor-patch
          path: provider-refactor.patch

      - name: Check legacy provider variant is gone
        run: |
          if grep -R "Provider::Local" src tests; then
            echo "Provider::Local remains"
            exit 1
          fi

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Commit validated provider refactor
        if: github.ref == 'refs/heads/future/model' && github.event_name == 'push'
        run: |
          if ! git diff --quiet -- src/config.rs src/main.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/config.rs src/main.rs
            git commit -m "OpenAI互換providerの責務を整理"
            git push
          fi

  docs:
    name: OpenAPI docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npm run docs:api:lint

      - name: Build API docs
        run: npm run docs:api

      - name: Check generated docs are up to date
        run: git diff --exit-code -- docs/api.html
