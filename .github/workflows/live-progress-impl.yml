name: Implement live progress

on:
  push:
    branches:
      - feat/live-generation-progress

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply progress UX changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/progress.rs")
          s = p.read_text()

          old_imports = "use std::io::{self, Write};\nuse std::sync::Mutex;\n"
          new_imports = "use std::io::{self, Write};\nuse std::sync::{mpsc, Arc, Mutex};\nuse std::thread::{self, JoinHandle};\nuse std::time::{Duration, Instant};\n"
          if old_imports not in s:
              raise SystemExit("progress imports changed unexpectedly")
          s = s.replace(old_imports, new_imports, 1)

          marker = "/// stderr 等へ固定書式で書く sink。識別子とパスは制御文字を可視化して一行性を守る。\n"
          heartbeat = r'''const DEFAULT_HEARTBEAT_INTERVAL: Duration = Duration::from_secs(5);

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum HeartbeatPhase {
              Batch { number: usize, total: usize },
              Retry { pending: usize },
          }

          enum HeartbeatCommand {
              Set(HeartbeatPhase),
              Pause,
              Stop,
          }

          struct HeartbeatWorker {
              tx: mpsc::Sender<HeartbeatCommand>,
              handle: Option<JoinHandle<()>>,
          }

          fn format_heartbeat(phase: HeartbeatPhase, elapsed: Duration) -> String {
              let seconds = elapsed.as_secs();
              match phase {
                  HeartbeatPhase::Batch { number, total } => {
                      format!("      batch {number}/{total}: provider待機中... {seconds}s")
                  }
                  HeartbeatPhase::Retry { pending } => {
                      format!("      retry: provider待機中... {seconds}s ({pending} tasks pending)")
                  }
              }
          }

          fn write_progress_line(writer: &Arc<Mutex<Box<dyn Write + Send>>>, line: &str) {
              if let Ok(mut writer) = writer.lock() {
                  let _ = writeln!(writer, "{line}");
                  let _ = writer.flush();
              }
          }

          fn heartbeat_loop(
              rx: mpsc::Receiver<HeartbeatCommand>,
              writer: Arc<Mutex<Box<dyn Write + Send>>>,
              interval: Duration,
          ) {
              let mut state: Option<(HeartbeatPhase, Instant)> = None;
              loop {
                  if state.is_none() {
                      match rx.recv() {
                          Ok(HeartbeatCommand::Set(phase)) => state = Some((phase, Instant::now())),
                          Ok(HeartbeatCommand::Pause) => {}
                          Ok(HeartbeatCommand::Stop) | Err(_) => break,
                      }
                      continue;
                  }

                  match rx.recv_timeout(interval) {
                      Ok(HeartbeatCommand::Set(phase)) => state = Some((phase, Instant::now())),
                      Ok(HeartbeatCommand::Pause) => state = None,
                      Ok(HeartbeatCommand::Stop) => break,
                      Err(mpsc::RecvTimeoutError::Timeout) => {
                          if let Some((phase, started)) = &state {
                              write_progress_line(&writer, &format_heartbeat(*phase, started.elapsed()));
                          }
                      }
                      Err(mpsc::RecvTimeoutError::Disconnected) => break,
                  }
              }
          }

          '''
          if marker not in s:
              raise SystemExit("progress sink marker changed unexpectedly")
          s = s.replace(marker, heartbeat + marker, 1)

          start = s.index("pub struct PlainProgressSink {")
          end = s.index("impl ProgressSink for PlainProgressSink {")
          replacement = r'''pub struct PlainProgressSink {
              writer: Arc<Mutex<Box<dyn Write + Send>>>,
              label: Mutex<String>,
              heartbeat: Mutex<Option<HeartbeatWorker>>,
              pending_retries: Mutex<usize>,
              heartbeat_interval: Duration,
          }
          impl PlainProgressSink {
              pub fn stderr(label: impl Into<String>) -> Self {
                  Self::with_writer(io::stderr(), label)
              }

              pub fn new(writer: impl Write + Send + 'static, label: impl Into<String>) -> Self {
                  Self::with_writer(writer, label)
              }

              pub fn with_writer(writer: impl Write + Send + 'static, label: impl Into<String>) -> Self {
                  Self::with_writer_and_interval(writer, label, DEFAULT_HEARTBEAT_INTERVAL)
              }

              fn with_writer_and_interval(
                  writer: impl Write + Send + 'static,
                  label: impl Into<String>,
                  heartbeat_interval: Duration,
              ) -> Self {
                  Self {
                      writer: Arc::new(Mutex::new(Box::new(writer))),
                      label: Mutex::new(escape(&label.into())),
                      heartbeat: Mutex::new(None),
                      pending_retries: Mutex::new(0),
                      heartbeat_interval,
                  }
              }

              /// 設定解決後の実行modeを、生成開始イベントより前に反映する。
              pub fn set_label(&self, label: impl Into<String>) {
                  if let Ok(mut current) = self.label.lock() {
                      *current = escape(&label.into());
                  }
              }

              fn send_heartbeat(&self, command: HeartbeatCommand) {
                  let Ok(mut slot) = self.heartbeat.lock() else {
                      return;
                  };

                  let needs_worker = matches!(&command, HeartbeatCommand::Set(_)) && slot.is_none();
                  if needs_worker {
                      let (tx, rx) = mpsc::channel();
                      let writer = Arc::clone(&self.writer);
                      let interval = self.heartbeat_interval;
                      let handle = thread::spawn(move || heartbeat_loop(rx, writer, interval));
                      *slot = Some(HeartbeatWorker {
                          tx,
                          handle: Some(handle),
                      });
                  }

                  if let Some(worker) = slot.as_ref() {
                      let _ = worker.tx.send(command);
                  }
              }

              fn update_heartbeat(&self, event: &ProgressEvent) {
                  let command = match event {
                      ProgressEvent::Parsed { .. } => {
                          if let Ok(mut pending) = self.pending_retries.lock() {
                              *pending = 0;
                          }
                          Some(HeartbeatCommand::Pause)
                      }
                      ProgressEvent::Planned {
                          initial_batches, ..
                      } if *initial_batches > 0 => {
                          if let Ok(mut pending) = self.pending_retries.lock() {
                              *pending = 0;
                          }
                          Some(HeartbeatCommand::Set(HeartbeatPhase::Batch {
                              number: 1,
                              total: *initial_batches,
                          }))
                      }
                      ProgressEvent::BatchComplete {
                          number,
                          total,
                          retries,
                          ..
                      } => {
                          let pending = if let Ok(mut pending) = self.pending_retries.lock() {
                              *pending = pending.saturating_add(*retries);
                              *pending
                          } else {
                              0
                          };
                          if number < total {
                              Some(HeartbeatCommand::Set(HeartbeatPhase::Batch {
                                  number: number + 1,
                                  total: *total,
                              }))
                          } else if pending > 0 {
                              Some(HeartbeatCommand::Set(HeartbeatPhase::Retry { pending }))
                          } else {
                              Some(HeartbeatCommand::Pause)
                          }
                      }
                      ProgressEvent::Retry { result, .. } => {
                          let pending = if let Ok(mut pending) = self.pending_retries.lock() {
                              if matches!(result, RetryResult::Success | RetryResult::Failed) {
                                  *pending = pending.saturating_sub(1);
                              }
                              *pending
                          } else {
                              0
                          };
                          if pending > 0 {
                              Some(HeartbeatCommand::Set(HeartbeatPhase::Retry { pending }))
                          } else {
                              Some(HeartbeatCommand::Pause)
                          }
                      }
                      ProgressEvent::Validated { .. }
                      | ProgressEvent::Saved { .. }
                      | ProgressEvent::Stdout
                      | ProgressEvent::ProviderError { .. }
                      | ProgressEvent::Failed { .. } => Some(HeartbeatCommand::Pause),
                      ProgressEvent::Fallback { .. } => None,
                      ProgressEvent::Planned { .. } => Some(HeartbeatCommand::Pause),
                  };

                  if let Some(command) = command {
                      self.send_heartbeat(command);
                  }
              }
          }

          impl Drop for PlainProgressSink {
              fn drop(&mut self) {
                  let Ok(mut slot) = self.heartbeat.lock() else {
                      return;
                  };
                  let Some(mut worker) = slot.take() else {
                      return;
                  };
                  let _ = worker.tx.send(HeartbeatCommand::Stop);
                  if let Some(handle) = worker.handle.take() {
                      let _ = handle.join();
                  }
              }
          }

          '''
          s = s[:start] + replacement + s[end:]

          old_emit = "impl ProgressSink for PlainProgressSink {\n    fn emit(&self, event: ProgressEvent) {\n        let line = match event {"
          new_emit = "impl ProgressSink for PlainProgressSink {\n    fn emit(&self, event: ProgressEvent) {\n        let heartbeat_event = event.clone();\n        let line = match event {"
          if old_emit not in s:
              raise SystemExit("progress emit changed unexpectedly")
          s = s.replace(old_emit, new_emit, 1)

          old_write = '''        if let Ok(mut writer) = self.writer.lock() {
              let _ = writeln!(writer, "{line}");
          }
              }
          }

          fn format_provider_error'''
          # Formatting of the source is four spaces, not the Python heredoc indentation.
          old_write = old_write.replace("          ", "")
          new_write = '''        write_progress_line(&self.writer, &line);
              self.update_heartbeat(&heartbeat_event);
          }
          }

          fn format_provider_error'''.replace("          ", "")
          if old_write not in s:
              raise SystemExit("progress writer tail changed unexpectedly")
          s = s.replace(old_write, new_write, 1)

          test_marker = "    #[test]\n    fn noop_never_writes_or_panics() {"
          heartbeat_test = r'''    #[test]
              fn heartbeat_lines_report_elapsed_provider_wait() {
                  assert_eq!(
                      format_heartbeat(
                          HeartbeatPhase::Batch {
                              number: 2,
                              total: 4,
                          },
                          Duration::from_secs(15),
                      ),
                      "      batch 2/4: provider待機中... 15s"
                  );
                  assert_eq!(
                      format_heartbeat(
                          HeartbeatPhase::Retry { pending: 2 },
                          Duration::from_secs(10),
                      ),
                      "      retry: provider待機中... 10s (2 tasks pending)"
                  );
              }

          '''.replace("              ", "")
          if test_marker not in s:
              raise SystemExit("progress tests changed unexpectedly")
          s = s.replace(test_marker, heartbeat_test + test_marker, 1)

          p.write_text(s)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check diff
        run: git diff --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check optional Gemini native adapter
        run: |
          cargo clippy --all-targets --features gemini-native -- -D warnings
          cargo test --features gemini-native

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-progress-impl.yml
          git add src/progress.rs
          git commit -m "feat: show live generation wait progress"
          git push origin HEAD:feat/live-generation-progress
