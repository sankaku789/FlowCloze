name: Finalize Stability Batching

on:
  push:
    branches:
      - feat/stability-aware-batching

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Materialize verified implementation
        run: |
          cat .preflight/impl.b64.* | tr -d '\r\n' > /tmp/flowcloze.patch.gz.b64
          test "$(wc -c < /tmp/flowcloze.patch.gz.b64)" -eq 27000
          echo 'ec0a28c81992798fc598fcb88cdb97d2a2a84a5dfb2c5107456eb304522ff491  /tmp/flowcloze.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/flowcloze.patch.gz.b64 > /tmp/flowcloze.patch.gz
          gzip --test /tmp/flowcloze.patch.gz
          gzip --decompress --stdout /tmp/flowcloze.patch.gz > /tmp/flowcloze.patch
          git apply --check /tmp/flowcloze.patch
          git apply /tmp/flowcloze.patch
          git apply --check .preflight/fix.patch
          git apply .preflight/fix.patch
          cargo fmt --all
      - name: Remove temporary staging files
        run: |
          rm -rf .preflight
          rm -f .github/workflows/preflight.yml
          rm -f .github/workflows/source-artifact.yml
          rm -f .github/workflows/finalize-stability-batching.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add stability-aware qblock batching'
          git push origin HEAD:feat/stability-aware-batching
